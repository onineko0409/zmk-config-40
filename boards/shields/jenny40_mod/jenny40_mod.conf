CONFIG_ZMK_KEYBOARD_NAME="Jenny40 Mod"
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Required for PS/2 TrackPoint UART driver
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Optional logging for debugging
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Combo stability for many Shift-based symbol combos
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=32
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=2

# Mouse key / scroll support
