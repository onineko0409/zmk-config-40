CONFIG_ZMK_KEYBOARD_NAME="Jenny40 Mod"
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# TrackPoint PS/2 UART driver
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# External VCC power control
CONFIG_ZMK_EXT_POWER=y

# Auto deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Manual soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# Logging
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Combo stability
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=32
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=2
